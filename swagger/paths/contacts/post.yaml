#/swagger/paths/students/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createContacts
description: 'Create a Contacts with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          userId:
            description: "Contact's unique identifier"
            type: string
            example: '674cbeb42a8bf128259c64b1'
          name:
            description: "Contact's name"
            type: string
            example: 'Roman'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380563452635'
          email:
            description: "Contact's email address"
            type: string
            example: 'yeicob.trinidad@feesites.com'
          isFavourite:
            description: "Indicates whether the contact is a favourite (true or false)"
            type: boolean
            example: false
          contactType:
            description: 'Type of the contact.Should be only: work, home or personal'
            enum: ['work', 'home', "personal"]
            type: string
            example: 'work'
          photo:
            description: "Contact's photo"
            type: string
            example: binary
responses:
  '201':
    description: Creates a contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contacts.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'

