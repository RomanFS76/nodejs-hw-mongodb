
tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Patch contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Roman'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380563452635'
          email:
            description: "Contact's email address"
            type: string
            example: 'yeicob.trinidad@feesites.com'
          isFavourite:
            description: "Indicates whether the contact is a favourite (true or false)"
            type: boolean
            example: false
          contactType:
            description: 'Type of the contact.Should be only: work, home or personal'
            enum: ['work', 'home', "personal"]
            type: string
            example: 'work'
          photo:
            description: "Contact's photo"
            type: string
            example: binary
responses:
  '200':
    description: 'Patch contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully patched a contact!"
            data:
              type: object
              $ref: '../../../components/schemas/contacts.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404-NotFoundId.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
