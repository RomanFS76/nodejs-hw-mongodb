tags:
  - Auth
summary: Reset password by sending email
operationId: sendEmail
description: 'Reset the user password by sending a reset email.'
security: []
requestBody:
  description: 'Reset password by sending an email to the user.'
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: "The token to verify the user for password reset. This should be a valid JWT token
                    representing the user session or email verification."
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
          properties:
          password:
            description: "New user's password."
            type: string
            example: 'NewPassword123'
responses:
  '200':
    description: Sending email
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
              required:
              #   - accessToken
              # properties:
              #   accessToken:
              #     type: string
              #     example: '4ziGnKTd7TV/QoTlhep3jCcgJERjgGg1t97j/aYz'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
