tags:
  - Auth
summary: Send email
operationId: sendEmail
description: 'Sending an email.'
security: []
requestBody:
  required: true
  description: 'Sending an email to the user, typically to reset the password or confirm an operation.'
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: "User's email"
            type: string
            example: 'LexyLux@gmail.com'
responses:
  '200':
    description: Send email
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
              example: {}
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
