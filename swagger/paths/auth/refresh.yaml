tags:
  - Auth
summary: Refreshing session
operationId: refreshSession
description: 'Refreshing session'
security: []
parameters:
  - in: cookie
    name: sessionId
    schema:
      type: string
      example: '67536f412ecc77b5fc92f4cb'
  - in: cookie
    name: refreshToken
    schema:
      type: string
      example: 'M00su751shVa8iIAggrVq/vT+FCc0GSwz0zwJ9Wt'
responses:
  '200':
    description: Refreshing session
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: '4ziGnKTd7TV/QoTlhep3jCcgJERjgGg1t97j/aYz'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
