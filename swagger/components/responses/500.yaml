# swagger/components/responses/401.yaml

description: Internal Server Error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code indicating the error
          example: 500
        message:
          type: string
          description: A detailed error message describing the issue
          example: "An unexpected error occurred on the server."

