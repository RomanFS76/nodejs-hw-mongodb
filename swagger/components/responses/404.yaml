# swagger/components/responses/401.yaml

description: Not found
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code indicating the error
          example: 404
        message:
          type: string
          description: Message describing the issue
          example: "Rout not found"

