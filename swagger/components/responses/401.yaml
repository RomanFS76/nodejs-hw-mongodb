# swagger/components/responses/401.yaml

description: Unauthorized error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code indicating the error
          example: 401
        message:
          type: string
          description: Error's message describing the issue
          example: UnauthorizedError

