# swagger/components/responses/401.yaml

description: Bad Request error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code indicating the error
          example: 400
        message:
          type: string
          description: Error's message describing the issue
          example: "contact validathion failed: contactType: "individual" is not a valid enum value for path "contactType""

