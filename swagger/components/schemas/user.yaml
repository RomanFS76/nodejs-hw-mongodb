type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's unique identifier"
    type: string
    example: 674c7d12e11872cafb6c706a
  name:
    description: 'User name'
    type: string
    example: 'Roman'
  email:
    description: 'User email address'
    type: string
    example: 'derrell@feesites.com'
  password:
    description: 'User password'
    type: string
    example: 'HOFi7kDgMm6EsCF'
  createdAt:
    description: 'User data creation'
    type: string
    example: '2024-11-01T13:36:10.304+00:00'
  updatedAt:
    description: 'User data update'
    type: string
    example: '2024-12-01T13:36:10.304+00:00'
