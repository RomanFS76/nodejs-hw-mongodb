type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's unique identifier"
    type: string
    example: 674c7d12e11872cafb6c706a
  name:
    description: 'Name's user'
    type: string
    example: 'Roman'
  email:
    description: 'User's email address'
    type: string
    example: 'derrell@feesites.com'
  password:
    description: 'User's hashed password'
    type: string
    example: '$2b$10$nGfYVbHOFi7kDgMm6EsCF.TafrP3l2Vy4IWo.7.JsHzcDn7pg6vjO'
