type: object
required:
  - _id
  - userId
  - name
  - phoneNumber
  - contactType
  - isFavourite
properties:
  _id:
    description: "Contact's unique identifier"
    type: string
    example: "674cbeb42a8bf128259c64b1"
  userId:
    description: "User's unique identifier"
    type: string
    example: "674c664a4e1c67a42ed5c71c"
  name:
    description: "Contact's name"
    type: string
    example: "Roman"
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: "+380563452635"
  email:
    description: "Contact's email address"
    type: string
    example: "yeicob.trinidad@feesites.com"
  isFavourite:
    description: "Indicates whether the contact is a favourite (true or false)"
    type: boolean
    example: false
  contactType:
    description: "Type of the contact.Should be only: work, home or personal"
    enum: ['work', 'home', 'personal']
    type: string
    example: "work"
  photo:
    description: "URL to the contact's photo"
    type: string
    example: "https://res.cloudinary.com/dnxvtdfg3/image/upload/v1733082946/photo/af…"
  createdAt:
    description: 'Contact data creation'
    type: string
    example: '2024-11-01T13:36:10.304+00:00'
  updatedAt:
    description: 'Contact data update'
    type: string
    example: '2024-12-01T13:36:10.304+00:00'
